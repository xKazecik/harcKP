# HARC — środowisko developerskie. Wstaje jednym poleceniem: make dev
version: "1.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harc
      POSTGRES_PASSWORD: harc
      POSTGRES_DB: harc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: harc
      MINIO_ROOT_PASSWORD: harc-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jednorazowa inicjalizacja bazy (§4): schemat, indeksy częściowe, słowniki,
  # jednostki korzeniowe i konto administratora. Dzięki niej `docker compose up`
  # daje działającą instancję BEZ żadnego ręcznego polecenia.
  # Idempotentna — przy każdym starcie doprowadza bazę do oczekiwanego stanu.
  init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://harc:harc@postgres:5432/harc
    entrypoint: ["/bin/sh", "/app/packages/db/init.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://harc:harc@postgres:5432/harc
      REDIS_URL: redis://redis:6379
      # Admin API wołane serwer→serwer po sieci compose. KEYCLOAK_ISSUER_URL
      # jest adresem dla przeglądarki (localhost) i wewnątrz kontenera
      # wskazywałby na samo API.
      KEYCLOAK_ISSUER_INTERNAL_URL: http://keycloak:8080/realms/harc
      # To samo dotyczy SMTP i S3 — w .env stoi localhost (dla uruchomienia
      # poza Dockerem), w sieci compose usługi mają własne nazwy.
      SMTP_HOST: mailhog
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://harc:harc@postgres:5432/harc
      REDIS_URL: redis://redis:6379
      # Kolejka mailowa i eksporty działają w tej samej sieci co MailHog
      # i MinIO (patrz api).
      SMTP_HOST: mailhog
      S3_ENDPOINT: http://minio:9000
      KEYCLOAK_ISSUER_INTERNAL_URL: http://keycloak:8080/realms/harc
    depends_on:
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      API_URL: http://api:3001
      # Token exchange z kontenera idzie po sieci wewnętrznej compose;
      # przeglądarka nadal używa KEYCLOAK_ISSUER_URL (localhost:8080).
      KEYCLOAK_ISSUER_INTERNAL_URL: http://keycloak:8080/realms/harc
    ports:
      - "3000:3000"
    depends_on:
      - api
      - keycloak

volumes:
  pgdata:
  miniodata:
