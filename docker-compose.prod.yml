# HARC — produkcja. Bez mailhog i minio: SMTP, S3, Postgres, Redis i Keycloak
# jako zależności zewnętrzne, konfigurowane w .env.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    ports:
      - "3001:3001"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    ports:
      - "3000:3000"
